# Runtime settings. Secrets come from environment variables, never this file:
#   TYPESAFE_API_KEY, OPENALEX_API_KEY, ANTHROPIC_API_KEY

db_path: data/paperbot.sqlite
digest_dir: digests
contact_email: ""          # put in the arXiv User-Agent so arXiv can reach you if something misbehaves.
                           # Prefer PAPERBOT_CONTACT_EMAIL in .env (wins over this; keeps it out of git).

harvest:
  lookback_overlap_days: 2   # re-query this much before the watermark; dedup absorbs repeats
  first_run_days: 7          # how far back to look the very first time a source runs
  arxiv:
    enabled: true
    min_interval_s: 3.0      # arXiv ToU: <= 1 request / 3 s, single connection
    # announce types to keep from RSS: new, cross, replace, replace-cross
    announce_types: [new, cross]
  openalex:
    enabled: true
    min_interval_s: 0.2
    per_page: 100
    max_pages_per_query: 3

triage:
  jev_model: jev-1.13.0      # pin a version; switch to jev-latest deliberately, then recalibrate
  concurrency: 8
  timeout_s: 20
  # Recalibrate (`paperbot label`, `paperbot calibrate`) after any rubric or jev_model change.
  relevance_threshold: 2.25  # on the 0-4 ladder; calibrated 12 Oct 2026 (79 labels, rubric v2, budget-constrained)
  # A paper scoring within `rescue_margin` below the threshold still passes if any
  # "must_have" facet Noul is >= rescue_noul.
  rescue_margin: 0.5
  rescue_noul: 0.9

debate:
  enabled: true
  max_papers_per_run: 8      # hard budget cap on LLM spend per run (highest Jev score first)
  overflow: skim             # passed papers over the cap: skim (list undebated in digest) | wait (queue)
  advocate_model: claude-sonnet-5-5
  skeptic_model: claude-sonnet-5-5
  judge_model: claude-opus-5-5
  # Thinking is always on for Opus 5.5 and counts against max_tokens, so leave headroom:
  # at 1500 the judge can run out mid-thought and return truncated JSON.
  max_tokens: 16000
  fulltext_max_chars: 60000  # truncate extracted PDF text before it goes into prompts
  # USD per 1M tokens, for the cost log (Anthropic first-party rates, checked 2026-10-06).
  # A model missing here is still logged, just without a cost. cache_write defaults to 1.25x input.
  pricing:
    claude-opus-5-5:   {input: 4.00, output: 20.00, cache_read: 0.20}
    claude-sonnet-5-5: {input: 2.00, output: 10.00, cache_read: 0.20}

digest:
  max_skim: 25               # "Also worth a look" list: top N skim papers by Jev score

deliver:
  onenote:                   # Windows only: writes a page via the OneNote desktop app, which syncs it
    enabled: true
    notebook: "AI Agents"    # must already be open in OneNote desktop
    section: "Paper Digests" # created if missing; one page per digest

friends:                     # invite-only Jev feeds for friends (see src/paperbot/friends.py)
  max_papers_per_run: 1500   # Jev cap per friend per `paperbot run` (~$0.06 at ~1,000 tokens/paper)
