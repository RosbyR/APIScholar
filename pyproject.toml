[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "paperbot"
version = "0.1.0"
description = "Passive research-paper agent: harvest abstracts, triage with Jev, debate the relevant ones, deliver a digest."
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.27",
  "pyyaml>=6",
  "feedparser>=6",
  "anthropic>=0.40",
  "pypdf>=4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "respx>=0.21", "reportlab>=4"]

[project.scripts]
paperbot = "paperbot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
